name: Tests y actualizar early

on:
  push:   
    branches:
      - main   # se ejecuta en cada commit en main

permissions:
  contents: write

jobs:
  test-and-update-early:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ejecutar tests
        run: mvn clean test 

      - name: Merge main into early
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          #Asegurar que estamos en main y actualizado
          git checkout main
          git pull origin main --ff-only
          #Traer early y movernos a ella
          git fetch origin early:early 
          git checkout early
          #Hacer merge de main a early
          git merge main --allow-unrelated-histories -m "Auto-update early from main after tests passed"
          #Push a early
          git push origin early